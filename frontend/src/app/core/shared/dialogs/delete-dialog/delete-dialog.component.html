<h1 mat-dialog-title>{{ title }}</h1>
<div mat-dialog-content>
  {{message}}
</div>
<div mat-dialog-actions>
   <button mat-raised-button color="warn" (click)="onNoClick()">
    Cancel
  </button>
  <button mat-raised-button color="primary" (click)="onConfirmClick()" cdkFocusInitial>
    Ok
  </button>
</div>
